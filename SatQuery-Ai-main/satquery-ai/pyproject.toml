[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-ai"
version = "0.1.0"
description = "Interactive Vision-Language Assistant for Multimodal Remote Sensing Image Analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SatQuery AI Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.28",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "rasterio>=1.3.9",
    "pyproj>=3.6.1",
    "shapely>=2.0.3",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
