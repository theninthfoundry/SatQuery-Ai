version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: satquery-postgis
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery_dev_password
      POSTGRES_DB: satquery_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
